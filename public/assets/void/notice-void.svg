<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 720" role="img" aria-labelledby="nvTitle nvDesc">
  <title id="nvTitle">The Registry  Notice of Disposition</title>
  <desc id="nvDesc">This filing is closed. Stamp: Void.</desc>
  <rect width="512" height="720" fill="#e8dcc6"/>
  <rect x="18" y="18" width="476" height="684" fill="none" stroke="#24180f" stroke-width="3"/>
  <text x="256" y="92" text-anchor="middle" font-family="Georgia, Times, serif" font-size="22" font-weight="700" letter-spacing="8" fill="#24180f">THE REGISTRY</text>
  <line x1="80" y1="118" x2="432" y2="118" stroke="#24180f" stroke-width="1"/>
  <text x="256" y="168" text-anchor="middle" font-family="Georgia, Times, serif" font-size="15" letter-spacing="3" fill="#3a2a1c">NOTICE OF DISPOSITION</text>
  <text x="256" y="300" text-anchor="middle" font-family="Georgia, Times, serif" font-size="20" fill="#24180f">THIS FILING IS CLOSED</text>
  <text x="256" y="344" text-anchor="middle" font-family="Georgia, Times, serif" font-size="18" fill="#24180f">THE GATE HAS BEEN ENTERED</text>
  <g transform="translate(256 540) rotate(-16)">
    <circle r="92" fill="none" stroke="#c1121f" stroke-width="10"/>
    <text x="0" y="16" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="42" letter-spacing="8" fill="#c1121f">VOID</text>
  </g>
</svg>
