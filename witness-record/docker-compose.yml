# Reference deployment: app + PostgreSQL + S3-compatible storage (MinIO) + ClamAV.
# For production use managed PostgreSQL and a real object store; see docs/DEPLOYMENT.md.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://witness:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/witness_record
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: witness-record
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-witness}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      CLAMAV_HOST: clamav
      TRUST_PROXY: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: witness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: witness_record
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U witness -d witness_record"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-witness}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
volumes:
  pgdata:
  miniodata:
